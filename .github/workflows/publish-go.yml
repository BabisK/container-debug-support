name: publish go helper image

# Publishes the Go debug-support image (Delve) to this repository's GitHub
# packages, for `skaffold debug` with
#   skaffold config set --global debug-helpers-registry ghcr.io/babisk/container-debug-support
# Skaffold pulls <registry>/go untagged, so :latest is what it uses.

on:
  push:
    branches: [duct-tape, publish-go-image]
    paths:
      - go/helper-image/**
      - .github/workflows/publish-go.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR image names must be lower case.
          images: ghcr.io/babisk/container-debug-support/go
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: go/helper-image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
